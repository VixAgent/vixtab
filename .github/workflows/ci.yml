name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: git identity for the playground commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: bun test test/
      - name: build
        if: matrix.os == 'ubuntu-latest'
        run: bun scripts/build.ts --targets linux-x64,win32-x64 --no-vsix
